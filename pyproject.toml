[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "json-shaper-lite"
version = "1.1.0"
description = "Turn key: value notes, CSV/TSV and Markdown tables into clean, typed JSON. CLI and MCP server. Runs locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
]
keywords = ["json", "csv", "tsv", "markdown", "markdown-table", "converter", "text-to-json", "cli", "mcp", "mcp-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tidybyte.gumroad.com/l/cznmeo"
Source = "https://github.com/tidybytetools/json-shaper-lite"
Issues = "https://github.com/tidybytetools/json-shaper-lite/issues"
Changelog = "https://github.com/tidybytetools/json-shaper-lite/blob/main/CHANGELOG.md"

[project.scripts]
json-shaper-lite = "json_shaper_lite:main"
json-shaper-lite-mcp = "json_shaper_lite_mcp:main"

[tool.setuptools]
py-modules = ["json_shaper_lite", "json_shaper_lite_mcp"]
